# nginx of the `web` container (deployment_rpi design §4): the PWA build with the SPA fallback,
# and the proxy of /api/ and /ws/ to `backend` (internal network). NPM, in front, terminates TLS.
# Installed as /etc/nginx/conf.d/default.conf, inside the `http` block of the image's nginx.conf.

# The client address comes from NPM's X-Forwarded-For, trusting only the private networks (NPM
# reaches `web` through a Docker network). No recursion: the LAST address is taken, the one that
# NPM appends, so whatever a client writes in that header is ignored (AC-05).
real_ip_header    X-Forwarded-For;
real_ip_recursive off;
set_real_ip_from  10.0.0.0/8;
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  192.168.0.0/16;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The useful log is the backend's, without addresses nor query strings (AC-09).
    access_log off;

    # Docker's DNS, resolved per request: `backend` keeps working after it is recreated with
    # another address, and `nginx -t` does not need the backend to exist.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # API: the client address is the only X-Forwarded-For entry the backend sees (AC-05).
    location ^~ /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSockets: upgrade, and at least 1 h open without client traffic (AC-04).
    location ^~ /ws/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Files with a content hash in their name: immutable for 1 year (AC-06).
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~ ^/workbox-[0-9a-f]+\.js$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Always revalidated: the entry point, the service worker and the manifest (AC-06).
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { application/manifest+json webmanifest; }
    }

    # Other files with an extension (icons, registerSW.js…): never the SPA fallback; a missing
    # one is a 404. Without a hash in their name, they are revalidated.
    location ~ \.[A-Za-z0-9]+$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Routes of the SPA (/, /p/…, /driver…): index.html (AC-04).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
