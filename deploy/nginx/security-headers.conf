# Security headers of every response of `web` (deployment_rpi AC-06). Included in each `location`:
# nginx does not inherit `add_header` into a block that defines its own.
# Referrer-Policy must send the origin to tile.openstreetmap.org (OSM tile usage policy): never
# `no-referrer`. HSTS: 6 months (15552000 s).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
add_header Strict-Transport-Security "max-age=15552000" always;
