[project]
name = "avisabus"
version = "0.1.0"
description = "AvisaBus backend: accessible boarding alerts for EMT València"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "typer",
    "structlog",
    "httpx",
    "sqlalchemy>=2",
]

[project.scripts]
avisabus = "avisabus.adapters.inbound.cli.main:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-socket",
    "ruff",
    "mypy",
    "import-linter",
    "hypothesis>=6.170.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avisabus"]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket --cov=avisabus.domain --cov=avisabus.application --cov-fail-under=80 -m 'not slow'"
asyncio_mode = "auto"
markers = ["spec(id): acceptance criterion verified by the test", "slow: excluded by default"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
packages = ["avisabus"]
mypy_path = "src"
strict = false

[[tool.mypy.overrides]]
module = ["avisabus.domain.*", "avisabus.application.*"]
strict = true
